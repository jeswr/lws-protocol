vocab:
  - id: lws
    value: https://www.w3.org/ns/lws#
    context: https://www.w3.org/ns/lws/v1

prefix:
  - id: as
    value: https://www.w3.org/ns/activitystreams#

  - id: schema
    value: https://schema.org/

  - id: dct
    value: http://purl.org/dc/terms/

  - id: dcterms
    value: http://purl.org/dc/terms/

  - id: ldp
    value: http://www.w3.org/ns/ldp#

  - id: odrl
    value: http://www.w3.org/ns/odrl/2/

  - id: sdo
    value: https://schema.org/

ontology:
  - property: dc:title
    value: Linked Web Storage Vocabulary

  - property: dc:description
    value: RDFS [[RDF-SCHEMA]] vocabulary used by the Linked Web Storage Protocol [[lws-core]]

  - property: rdfs:seeAlso
    value: https://www.w3.org/TR/lws-protocol/

class:
  - id: Container
    label: Container
    comment: A resource that contains other resources.

  - id: DataResource
    label: Data Resource
    comment: A data-bearing resource such as a document, image, or structured data file.

  - id: Storage
    label: Storage
    comment: A Linked Web Storage instance.

  - id: StorageRoot
    label: Storage Root
    comment: A service endpoint for a storage root container.

  - id: OpenIdProvider
    label: OpenID Provider
    comment: An OpenID Connect identity provider service.
    defined_by: https://www.w3.org/TR/lws-authn-openid/

  - id: Notification
    label: Notification
    comment: A notification envelope describing an event that occurred on a resource.
    defined_by: https://www.w3.org/TR/lws-core/

  - id: NotificationService
    label: Notification Service
    comment: A service through which clients subscribe to resource change notifications.
    defined_by: https://www.w3.org/TR/lws-core/

  - id: WebhookSubscription
    label: Webhook Subscription
    comment: A subscription type that delivers notifications via HTTP POST to a subscriber-provided inbox URL.
    defined_by: https://www.w3.org/TR/lws-core/

  - id: AccessProfile
    label: Access Profile
    comment: An access profile describes the requirements for expressing a valid access policy.

  - id: AccessPolicy
    label: Access Policy
    comment: An access policy expresses the actions, targets, and constraints for a particular access request or grant.

  - id: AccessGrant
    label: Access Grant
    comment: An authorization by a storage controller granting access to resources.

  - id: AccessGrantService
    label: Access Grant Service
    comment: A service endpoint for managing access grants.

  - id: AccessRequestService
    label: Access Request Service
    comment: A service endpoint for managing access requests.

  - id: AccessRequest
    label: Access Request
    comment: A request for access; submission alone confers no authority.

  - id: StorageResource
    label: Storage Resource
    comment: A resource managed by a storage.

  - id: RepresentationCapability
    label: Representation Capability
    comment: Supported content types and an optional layout guarantee for one object class and service scope.

  - id: AuthorizationBindingCapability
    label: Authorization Binding Capability
    comment: The authoritative authorization binding and executable subset configured for a storage scope.

  - id: rdfs:Resource
    label: Resource
    external: true
    comment: An RDF resource, as defined by RDF Schema.

property:
  - id: items
    label: items
    domain: lws:Container
    comment: Unordered membership statements for the current authorized page of a container listing.
    container: set
    range: rdfs:Resource

  - id: totalItems
    label: total items
    domain: lws:Container
    comment: The total number of items in a container.
    range: xsd:integer

  - id: dct:format
    label: format
    domain: lws:DataResource
    comment: The media type of a data resource.

  - id: dcterms:modified
    label: modified
    domain: lws:DataResource
    range: xsd:dateTime
    comment: The date and time the resource was last modified.

  - id: sdo:size
    label: size
    domain: lws:DataResource
    range: xsd:long
    comment: The size of the resource in bytes.

  - id: capability
    label: capability
    domain: lws:Storage
    comment: A capability supported by the storage.
    container: set
    range: rdfs:Resource

  - id: PreferLinkRelations
    label: Prefer Link Relations
    comment: A preference URI for including or omitting specific link relations in responses.

  - id: subscriptionType
    label: subscription type
    domain: lws:NotificationService
    comment: The subscription types supported by a notification service.
    defined_by: https://www.w3.org/TR/lws-core/

  - id: subscription
    label: subscription
    range: xsd:anyURI
    comment: The URL of the subscription resource or connection endpoint.
    defined_by: https://www.w3.org/TR/lws-core/

  - id: activity
    label: activity
    domain: lws:Notification
    comment: The Activity Streams 2.0 activity payload within a notification.
    defined_by: https://www.w3.org/TR/lws-core/

  - id: topic
    label: topic
    range: xsd:anyURI
    comment: An array of resource URIs covered by a subscription.
    defined_by: https://www.w3.org/TR/lws-core/

  - id: storage
    label: storage
    range: rdfs:Resource
    comment: The canonical URI identifying an LWS storage.

  - id: as:Create
    label: Create
    comment: An activity representing the creation of a resource.

  - id: as:Update
    label: Update
    comment: An activity representing the update of a resource.

  - id: as:Delete
    label: Delete
    comment: An activity representing the deletion of a resource.

  - id: as:object
    range: rdfs:Resource
    label: object
    comment: The primary object of an activity.

  - id: as:actor
    range: rdfs:Resource
    label: actor
    comment: The agent that performed the activity.

  - id: as:target
    label: target
    comment: The target of the activity.

  - id: as:origin
    range: rdfs:Resource
    label: origin
    comment: The origin of a Move activity.

  - id: as:published
    label: published
    range: xsd:dateTime
    comment: The date and time the activity was published.

  - id: ldp:inbox
    label: inbox
    range: rdfs:Resource
    comment: A URL to which notifications are delivered via HTTP POST.

  - id: sdo:expires
    label: expires
    range: xsd:dateTime
    comment: The date and time at which a subscription expires.

  - id: access
    label: access
    comment: The access policies associated with an access request or grant.
    container: set
    range: rdfs:Resource

  - id: dcterms:conformsTo
    label: conforms to
    external: true
    comment: An established standard to which the described resource conforms.
    range: rdfs:Resource

  - id: odrl:action
    label: action
    external: true
    comment: The operation relating to the asset of the rule.
    one_of:
    - odrl:read
    - odrl:modify
    - odrl:delete
    - create

  - id: odrl:assignee
    label: assignee
    external: true
    comment: The party that is assigned the rule.
    range: rdfs:Resource

  - id: odrl:target
    label: target
    external: true
    comment: The asset that is the target of the rule.
    range: rdfs:Resource

  - id: odrl:constraint
    label: constraint
    external: true
    comment: A constraint that refines the semantics of an action or rule.

  - id: odrl:leftOperand
    label: left operand
    external: true
    comment: The left operand of a constraint.
    one_of:
    - odrl:purpose
    - odrl:dateTime
    - client
    - dcterms:type
    - dcterms:format

  - id: odrl:operator
    label: operator
    external: true
    comment: The operator of a constraint.
    one_of:
    - odrl:eq
    - odrl:neq
    - odrl:lt
    - odrl:gt
    - odrl:lteq
    - odrl:gteq
    - odrl:isAnyOf
    - odrl:isAllOf
    - odrl:isNoneOf

  - id: odrl:rightOperand
    label: right operand
    external: true
    comment: The right operand of a constraint.

  - id: appliesTo
    label: applies to
    range: rdfs:Resource
    comment: The object class covered by a representation capability.

  - id: produces
    label: produces
    range: xsd:string
    comment: A supported response media type, including required parameters.

  - id: accepts
    label: accepts
    range: xsd:string
    comment: A supported request media type, including required parameters.

  - id: representationScope
    label: representation scope
    range: rdfs:Resource
    comment: The service endpoint to which a representation capability applies; omission denotes storage-wide
      class support.

  - id: representationProfile
    label: representation profile
    range: rdfs:Resource
    comment: An additional layout contract guaranteed by an advertised representation.

  - id: authorizationBinding
    label: authorization binding
    range: rdfs:Resource
    comment: The authoritative policy-language binding configured by the server.

  - id: supportedAction
    label: supported action
    range: rdfs:Resource
    comment: An action implemented by the advertised executable authorization subset.

  - id: value
    label: value
    range: rdfs:Resource
    comment: A resource identifier in the legacy LWS access target model.

  - id: odrl:permission
    label: permission
    range: rdfs:Resource
    comment: A Permission in an ODRL Policy.
    external: true

  - id: odrl:prohibition
    label: prohibition
    range: rdfs:Resource
    comment: A Prohibition in an ODRL Policy.
    external: true

  - id: odrl:profile
    label: profile
    range: rdfs:Resource
    comment: The ODRL profile to which a policy conforms.
    external: true

  - id: odrl:conflict
    label: conflict
    range: rdfs:Resource
    comment: The explicit ODRL conflict strategy.
    external: true

individual:
  - id: create
    label: create
    comment: An action representing the creation of a new resource within a container.

  - id: client
    label: client
    comment: A left operand representing the client identifier for an HTTP request.

  - id: FixedJsonRepresentation
    label: Fixed JSON Representation
    comment: The optional fixed JSON layout defined by LWS; this draft identifier is subject to WG review.

  - id: OdrlAccessProfile
    label: ODRL Access Profile
    comment: The ODRL access-request and grant profile defined by the companion specification; this draft identifier
      is subject to WG review.

  - id: WacAuthorization
    label: WAC Authorization
    comment: The optional WAC authorization binding.

  - id: AcpAuthorization
    label: ACP Authorization
    comment: The optional ACP authorization binding.

  - id: OdrlAuthorization
    label: ODRL Authorization
    comment: The optional ODRL authorization binding.

json_ld:
  alias:
    id: "@id"
    type: "@type"
